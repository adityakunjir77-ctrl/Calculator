<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Assignment 1 - JavaScript Calculator</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f0f2f5; display: flex; justify-content: center; padding-top: 60px; }
    .calc { background: #fff; padding: 24px; border-radius: 12px; box-shadow: 0 4px 12px rgba(0,0,0,.12); width: 320px; }
    h2 { margin-top: 0; text-align: center; }
    input, select, button { width: 100%; padding: 10px; margin: 6px 0; font-size: 16px; box-sizing: border-box; }
    button { background: #4f46e5; color: #fff; border: none; border-radius: 6px; cursor: pointer; }
    button:hover { background: #4338ca; }
    #result { margin-top: 12px; font-size: 20px; font-weight: bold; text-align: center; min-height: 28px; }
  </style>
</head>
<body>
  <div class="calc">
    <h2>Calculator</h2>
    <input type="number" id="num1" placeholder="First number" />
    <select id="operator">
      <option value="+">+ Addition</option>
      <option value="-">- Subtraction</option>
      <option value="*">× Multiplication</option>
      <option value="/">÷ Division</option>
    </select>
    <input type="number" id="num2" placeholder="Second number" />
    <button onclick="calculate()">Calculate</button>
    <div id="result"></div>
  </div>
  <script src="script.js"></script>
</body>
</html>
